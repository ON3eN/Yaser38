<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تواصل معنا - منصة فرص</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background-color: #1c3c34;
      color: #ffffff;
      padding-top: 70px;
      min-height: 100vh;
    }

    header {
      background-color: #0f172a;
      color: white;
      height: 70px;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .logo {
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo img {
      height: 24px;
    }

    nav {
      display: flex;
      gap: 1rem;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: #72ef85;
    }

    .menu-toggle {
      display: none;
      font-size: 1.6rem;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .mobile-menu {
      display: none;
      flex-direction: column;
      background-color: #0f172a;
      position: absolute;
      top: 70px;
      right: 0;
      width: 100%;
      z-index: 999;
    }

    .mobile-menu a {
      color: white;
      padding: 1rem;
      border-bottom: 1px solid #1e293b;
      text-decoration: none;
    }

    .contact-section {
      display: flex;
      justify-content: center;
      align-items: start;
      gap: 2rem;
      padding: 3rem 2rem;
      flex-wrap: wrap;
    }

    .contact-form {
      background-color: #2a5248;
      padding: 2rem;
      border-radius: 16px;
      width: 420px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    }

    .contact-form h1 {
      text-align: center;
      color: #ffffff;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, textarea {
      padding: 0.8rem;
      border-radius: 8px;
      border: none;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      background-color: #f8fafc;
      color: #1e293b;
    }

    input::placeholder,
    textarea::placeholder {
      color: #64748b;
    }

    textarea {
      resize: vertical;
    }

    button {
      padding: 0.8rem;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #059669;
    }

    .social-box {
      background-color: #2a5248;
      padding: 2rem;
      border-radius: 16px;
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    }

    .social-box h2 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 1rem;
    }

    .social-box a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      background-color: #14532d;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      transition: background-color 0.3s;
    }

    .social-box a:hover {
      background-color: #166534;
    }

    .social-box a img {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 768px) {
      nav {
        display: none;
      }

      .menu-toggle {
        display: block;
      }

      .mobile-menu.show {
        display: flex;
      }

      .contact-section {
        flex-direction: column-reverse;
        align-items: center;
      }

      .contact-form, .social-box {
        width: 100%;
        max-width: 90vw;
      }
    }
  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <header>
    <div class="logo">
      <img src="frsa.png" alt="شعار">
      منصة فرص
    </div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav>
      <a href="index.html">🏠 الرئيسية</a>
      <a href="jobs.html">💼 الوظائف</a>
      <a href="about.html">📄 من نحن</a>
      <a href="contact.html">📞 تواصل معنا</a>
    </nav>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">🏠 الرئيسية</a>
      <a href="jobs.html">💼 الوظائف</a>
      <a href="about.html">📄 من نحن</a>
      <a href="contact.html">📞 تواصل معنا</a>
    </div>
  </header>

  <!-- الصفحة الرئيسية -->
  <section class="contact-section">

    <!-- شبكات التواصل -->
    <div class="social-box">
      <h2>تابعنا على</h2>
      <a href="https://x.com" target="_blank"><img src="x-icon.png" alt="X">منصة X</a>
      <a href="https://tiktok.com" target="_blank"><img src="tiktok-icon.png" alt="TikTok">تيك توك</a>
      <a href="https://instagram.com" target="_blank"><img src="instagram-icon.png" alt="Instagram">انستقرام</a>
      <a href="mailto:foras@example.com"><img src="gmail-icon.png" alt="Gmail">البريد الإلكتروني</a>
    </div>

    <!-- نموذج التواصل -->
    <div class="contact-form">
      <h1>تواصل معنا</h1>
      <form>
        <input type="text" placeholder="الاسم الكامل" required>
        <input type="email" placeholder="البريد الإلكتروني" required>
        <textarea rows="5" placeholder="اكتب رسالتك هنا..." required></textarea>
        <button type="submit">إرسال</button>
      </form>
    </div>

  </section>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      menu.classList.toggle("show");
    }
  </script>

</body>
</html>
