<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الشريط السفلي - فرص</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    footer {
      background-color: #1e293b;
      color: #e2e8f0;
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.95rem;
      margin-top: auto;
    }

    .social {
      margin-top: 1rem;
    }

    .social a {
      color: #facc15;
      margin: 0 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .social a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <footer>
    <p>© 2025 منصة فرص - جميع الحقوق محفوظة</p>
    <div class="social">
      <a href="#">تويتر</a> |
      <a href="#">لينكدإن</a> |
      <a href="#">فيسبوك</a>
    </div>
  </footer>
</body>
</html>
