<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
    }

    header {
      background-color: #ffffff; /* أبيض */
      color: #1e293b; /* رمادي غامق */
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 1000;
      height: 70px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 1.1rem;
      font-weight: bold;
      gap: 0.5rem;
      color: #1e293b;
    }

    .logo img {
      width: 24px;
      height: 24px;
    }

    nav {
      display: flex;
      gap: 1rem;
    }

    nav a {
      color: #1e293b; /* رمادي غامق */
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #14532d; /* أخضر داكن عند التحويم */
    }

    .menu-toggle {
      display: none;
      font-size: 1.6rem;
      background: none;
      border: none;
      color: #1e293b;
      cursor: pointer;
    }

    /* القائمة الجوالية */
    @media (max-width: 768px) {
      nav {
        position: absolute;
        top: 70px;
        right: 0;
        width: 100%;
        flex-direction: column;
        background-color: #ffffff;
        display: none;
        padding: 1rem 2rem;
        border-top: 1px solid #e2e8f0;
      }

      nav a {
        margin: 0.5rem 0;
      }

      nav.show {
        display: flex;
      }

      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="frsa.png" alt="شعار فرص" />
      منصة فرص
    </div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav id="main-nav">
      <a href="index.html">🏠 الرئيسية</a>
      <a href="jobs.html">💼 الوظائف</a>
      <a href="about.html">📄 من نحن</a>
      <a href="contact.html">📞 تواصل معنا</a>
    </nav>
  </header>

  <script>
    function toggleMenu() {
      document.getElementById('main-nav').classList.toggle('show');
    }
  </script>
</body>
</html>
